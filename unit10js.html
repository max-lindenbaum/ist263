<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script</title>
    <script>
       function FirstFunction () {
       alert("Hello World")
       }
       function clicky () {
        alert('Thanks for clicking:');
       }
       function hovery () {
        alert('Thanks for rolling over me!');
       }
       function rollout() {
        alert('My first JavaScript program!');
       }
    </script>
</head>
<body onload="FirstFunction()">
    <h1>JavaScript Basics</h1>
    <p onclick="clicky ();">Lorem ipsum dolor sit amet consectetur adipisicing elit. Delectus impedit exercitationem quisquam minima praesentium voluptate at, ad aut eos doloremque fugit necessitatibus ducimus quia non obcaecati voluptas deserunt, repellat sequi!</p>
    <h2 onmouseover="hovery();">Hover Text</h2>
    <a href="#" onmouseout="rollout();">click for a message</a>
</body>
</html>
